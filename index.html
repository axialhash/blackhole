<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>black hole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; }
  #ui {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 10;
  }
  .btn {
    font-family: 'Courier New', monospace; font-size: 11px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.4); padding: 8px 16px; border-radius: 6px;
    cursor: pointer; transition: all 0.2s; letter-spacing: 0.08em;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover, .btn.active {
    border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.1);
  }
  #label {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    font-family: 'Courier New', monospace; font-size: 10px;
    color: rgba(255,255,255,0.15); letter-spacing: 0.15em;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">BLACK HOLE SIMULATION</div>
<div id="ui">
  <button class="btn active" data-shape="galaxy">GALAXY</button>
  <button class="btn" data-shape="AX">AX</button>
  <button class="btn" data-shape="harar">HARAR</button>
  <button class="btn" data-shape="reset">RESET</button>
</div>

<script>
// ─── CONFIG ───
const PARTICLE_COUNT = 4000;
const BH_MASS = 5000;
const G = 0.5;               // gravitational constant
const ORBIT_DAMPING = 0.9995; // very slight drag to prevent escape
const TRAIL_LENGTH = 8;
const BH_RADIUS = 8;

// ─── CANVAS ───
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => {
  resize();
  if (currentShape !== 'galaxy') generateShapeTargets(currentShape);
});

// ─── STATE ───
let particles = [];
let bh = { x: 0, y: 0, vx: 0, vy: 0 };
let currentShape = 'galaxy';
let shapePhase = false;
let shapeTimer = 0;
let shapeTargets = [];
let frameCount = 0;

// ─── PARTICLE ───
function createParticle(scattered) {
  if (scattered) {
    // spread across the screen
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      mass: 0.5 + Math.random() * 1.5,
      hue: Math.random() * 360,
      brightness: 60 + Math.random() * 40,
      size: 0.8 + Math.random() * 2,
      trail: [],
      targetIdx: -1,
    };
  }
  // orbital
  const angle = Math.random() * Math.PI * 2;
  const dist = 150 + Math.random() * Math.min(W, H) * 0.35;
  const speed = Math.sqrt(G * BH_MASS / dist) * (0.7 + Math.random() * 0.6);
  return {
    x: bh.x + Math.cos(angle) * dist,
    y: bh.y + Math.sin(angle) * dist,
    vx: Math.cos(angle + Math.PI / 2) * speed,
    vy: Math.sin(angle + Math.PI / 2) * speed,
    mass: 0.5 + Math.random() * 1.5,
    hue: (angle / (Math.PI * 2) * 360 + Math.random() * 40) % 360,
    brightness: 60 + Math.random() * 40,
    size: 0.8 + Math.random() * 2,
    trail: [],
    targetIdx: -1,
  };
}

function initParticles(mode) {
  particles = [];
  bh.x = W / 2;
  bh.y = H / 2;
  shapePhase = false;
  shapeTimer = 0;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(createParticle(mode === 'scattered'));
  }
}

// ─── TEXT/SHAPE TARGETS ───
function getTextTargets(text) {
  const offCanvas = document.createElement('canvas');
  const offCtx = offCanvas.getContext('2d');
  const scale = Math.min(W, H) / 600;
  const fontSize = Math.floor(180 * scale);
  offCanvas.width = W;
  offCanvas.height = H;

  offCtx.fillStyle = '#fff';
  offCtx.font = `900 ${fontSize}px "Courier New", monospace`;
  offCtx.textAlign = 'center';
  offCtx.textBaseline = 'middle';
  offCtx.fillText(text, W / 2, H / 2);

  const imageData = offCtx.getImageData(0, 0, W, H);
  const points = [];
  const step = 4;

  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      const i = (y * W + x) * 4;
      if (imageData.data[i + 3] > 128) {
        points.push({ x, y });
      }
    }
  }

  // shuffle and pick PARTICLE_COUNT targets
  for (let i = points.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [points[i], points[j]] = [points[j], points[i]];
  }

  return points.slice(0, PARTICLE_COUNT);
}

function generateShapeTargets(shape) {
  if (shape === 'galaxy') {
    shapeTargets = [];
    shapePhase = false;
    return;
  }
  shapeTargets = getTextTargets(shape);
}

// ─── SIMULATION ───
function update() {
  frameCount++;
  shapeTimer++;

  // transition to shape phase after 4 seconds
  if (!shapePhase && currentShape !== 'galaxy' && shapeTargets.length > 0 && shapeTimer > 240) {
    shapePhase = true;
    // assign each particle to nearest target
    const assigned = new Set();
    for (let i = 0; i < particles.length; i++) {
      let bestDist = Infinity;
      let bestIdx = -1;
      for (let j = 0; j < shapeTargets.length; j++) {
        if (assigned.has(j)) continue;
        const dx = particles[i].x - shapeTargets[j].x;
        const dy = particles[i].y - shapeTargets[j].y;
        const d = dx * dx + dy * dy;
        if (d < bestDist) {
          bestDist = d;
          bestIdx = j;
        }
      }
      if (bestIdx >= 0) {
        particles[i].targetIdx = bestIdx;
        assigned.add(bestIdx);
      }
    }
  }

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    // gravity toward black hole
    const dx = bh.x - p.x;
    const dy = bh.y - p.y;
    const distSq = dx * dx + dy * dy;
    const dist = Math.sqrt(distSq);

    if (dist > BH_RADIUS) {
      const force = (G * BH_MASS * p.mass) / distSq;
      const ax = (dx / dist) * force / p.mass;
      const ay = (dy / dist) * force / p.mass;
      p.vx += ax;
      p.vy += ay;
    }

    // shape attraction
    if (shapePhase && p.targetIdx >= 0 && shapeTargets[p.targetIdx]) {
      const target = shapeTargets[p.targetIdx];
      const tdx = target.x - p.x;
      const tdy = target.y - p.y;
      const td = Math.sqrt(tdx * tdx + tdy * tdy);
      if (td > 1) {
        // spring force toward target
        const spring = 0.03;
        const damp = 0.92;
        p.vx += tdx * spring;
        p.vy += tdy * spring;
        p.vx *= damp;
        p.vy *= damp;
      }
    }

    // orbital damping
    p.vx *= ORBIT_DAMPING;
    p.vy *= ORBIT_DAMPING;

    // speed limit
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (speed > 15) {
      p.vx = (p.vx / speed) * 15;
      p.vy = (p.vy / speed) * 15;
    }

    // update position
    p.x += p.vx;
    p.y += p.vy;

    // trail
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > TRAIL_LENGTH) p.trail.shift();

    // respawn if out of bounds
    if (p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 100 + Math.random() * 200;
      p.x = bh.x + Math.cos(angle) * dist;
      p.y = bh.y + Math.sin(angle) * dist;
      const speed = Math.sqrt(G * BH_MASS / dist) * 0.8;
      p.vx = Math.cos(angle + Math.PI / 2) * speed;
      p.vy = Math.sin(angle + Math.PI / 2) * speed;
      p.trail = [];
      p.targetIdx = -1;
    }

    // hue shift
    if (!shapePhase) {
      p.hue = (p.hue + 0.1) % 360;
    }
  }
}

// ─── RENDER ───
function render() {
  // fade trail
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // accretion disk glow
  const gradient = ctx.createRadialGradient(bh.x, bh.y, BH_RADIUS, bh.x, bh.y, 120);
  gradient.addColorStop(0, 'rgba(180, 100, 255, 0.15)');
  gradient.addColorStop(0.3, 'rgba(100, 50, 200, 0.08)');
  gradient.addColorStop(0.6, 'rgba(50, 20, 150, 0.03)');
  gradient.addColorStop(1, 'transparent');
  ctx.fillStyle = gradient;
  ctx.fillRect(bh.x - 120, bh.y - 120, 240, 240);

  // particles
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    // trail
    if (p.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(p.trail[0].x, p.trail[0].y);
      for (let j = 1; j < p.trail.length; j++) {
        ctx.lineTo(p.trail[j].x, p.trail[j].y);
      }
      ctx.strokeStyle = `hsla(${p.hue}, 80%, ${p.brightness}%, 0.15)`;
      ctx.lineWidth = p.size * 0.4;
      ctx.stroke();
    }

    // particle
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    const alpha = shapePhase ? 0.8 : 0.6;
    ctx.fillStyle = `hsla(${p.hue}, 80%, ${p.brightness}%, ${alpha})`;
    ctx.fill();
  }

  // black hole core
  ctx.beginPath();
  ctx.arc(bh.x, bh.y, BH_RADIUS + 2, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();

  // event horizon ring
  ctx.beginPath();
  ctx.arc(bh.x, bh.y, BH_RADIUS + 3, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(140, 80, 255, ${0.3 + Math.sin(frameCount * 0.03) * 0.1})`;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// ─── LOOP ───
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// ─── INPUT ───
let dragging = false;

canvas.addEventListener('mousedown', (e) => {
  dragging = true;
  bh.x = e.clientX;
  bh.y = e.clientY;
});
canvas.addEventListener('mousemove', (e) => {
  if (dragging) {
    bh.x = e.clientX;
    bh.y = e.clientY;
  }
});
canvas.addEventListener('mouseup', () => { dragging = false; });

canvas.addEventListener('touchstart', (e) => {
  dragging = true;
  bh.x = e.touches[0].clientX;
  bh.y = e.touches[0].clientY;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  if (dragging) {
    bh.x = e.touches[0].clientX;
    bh.y = e.touches[0].clientY;
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = false; });

// buttons
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const shape = btn.dataset.shape;

    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (shape === 'reset') {
      currentShape = 'galaxy';
      initParticles('orbital');
      shapeTargets = [];
      return;
    }

    currentShape = shape;
    shapePhase = false;
    shapeTimer = 0;
    generateShapeTargets(shape);
  });
});

// ─── INIT ───
initParticles('orbital');
loop();
</script>
</body>
</html>
