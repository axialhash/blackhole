<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>black hole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  #ui {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10;
  }
  .btn {
    font-family: 'Courier New', monospace; font-size: 11px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.3); padding: 8px 14px; border-radius: 4px;
    cursor: pointer; transition: all 0.15s; letter-spacing: 0.06em;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { background: rgba(255,255,255,0.1); }
  .btn.on { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button class="btn on" data-s="orbit">ORBIT</button>
  <button class="btn" data-s="ax">AX</button>
  <button class="btn" data-s="harar">HARAR</button>
  <button class="btn" data-s="reset">RESET</button>
</div>

<script>
const C = document.getElementById('c');
const X = C.getContext('2d');
let W, H, mobile;
const isMobile = () => innerWidth < 768;

// ── tunables ──
const COUNT = [3000, 1200]; // [desktop, mobile]
const G = 0.4;
const BH_MASS = 4000;
const DAMP = 0.9997;
const BH_R = 6;
let N, p, bh, shape, shapeT, shapeOn, tgt, frame;

function resize() {
  W = C.width = innerWidth;
  H = C.height = innerHeight;
  mobile = isMobile();
  N = COUNT[+mobile];
}

// ── particle ──
function makeP(angle, dist) {
  if (angle === undefined) {
    angle = Math.random() * 6.2832;
    dist = 120 + Math.random() * Math.min(W, H) * 0.4;
  }
  const spd = Math.sqrt(G * BH_MASS / dist) * (0.75 + Math.random() * 0.5);
  return [
    bh[0] + Math.cos(angle) * dist,  // x
    bh[1] + Math.sin(angle) * dist,  // y
    Math.cos(angle + 1.5708) * spd,  // vx
    Math.sin(angle + 1.5708) * spd,  // vy
    0.6 + Math.random() * 1.4,       // mass
    0.4 + Math.random() * 0.6,       // alpha (precomputed)
    -1,                               // target idx
  ];
}

function init() {
  resize();
  bh = [W / 2, H / 2];
  shape = 'orbit';
  shapeOn = false;
  shapeT = 0;
  tgt = [];
  frame = 0;
  p = [];
  for (let i = 0; i < N; i++) p.push(makeP());
}

// ── text targets ──
function textPts(text) {
  const cv = document.createElement('canvas');
  const cx = cv.getContext('2d');
  const s = Math.min(W, H) / 500;
  const fs = Math.floor(160 * s);
  cv.width = W; cv.height = H;
  cx.fillStyle = '#fff';
  cx.font = `900 ${fs}px "Courier New",monospace`;
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillText(text, W / 2, H / 2);
  const d = cx.getImageData(0, 0, W, H).data;
  const pts = [];
  const step = mobile ? 6 : 4;
  for (let y = 0; y < H; y += step)
    for (let x = 0; x < W; x += step)
      if (d[(y * W + x) * 4 + 3] > 128) pts.push(x, y);
  // shuffle pairs
  for (let i = pts.length - 2; i > 0; i -= 2) {
    const j = (Math.random() * (i / 2 + 1) | 0) * 2;
    [pts[i], pts[j]] = [pts[j], pts[i]];
    [pts[i+1], pts[j+1]] = [pts[j+1], pts[i+1]];
  }
  return pts;
}

// ── physics ──
function step() {
  shapeT++;
  const bhx = bh[0], bhy = bh[1];

  // activate shape phase
  if (!shapeOn && shape !== 'orbit' && tgt.length && shapeT > 180) {
    shapeOn = true;
    // assign nearest targets
    const used = new Uint8Array(tgt.length / 2);
    for (let i = 0; i < N; i++) {
      let bd = 1e18, bi = -1;
      const px = p[i][0], py = p[i][1];
      for (let j = 0; j < tgt.length; j += 2) {
        if (used[j >> 1]) continue;
        const dx = px - tgt[j], dy = py - tgt[j+1];
        const d = dx * dx + dy * dy;
        if (d < bd) { bd = d; bi = j; }
      }
      if (bi >= 0) { p[i][6] = bi >> 1; used[bi >> 1] = 1; }
    }
  }

  for (let i = 0; i < N; i++) {
    const q = p[i];
    const dx = bhx - q[0], dy = bhy - q[1];
    const d2 = dx * dx + dy * dy;
    const d = Math.sqrt(d2);

    // gravity
    if (d > BH_R) {
      const f = G * BH_MASS / d2;
      q[2] += (dx / d) * f;
      q[3] += (dy / d) * f;
    }

    // shape spring
    if (shapeOn && q[6] >= 0) {
      const ti = q[6] * 2;
      const tx = tgt[ti], ty = tgt[ti + 1];
      const sdx = tx - q[0], sdy = ty - q[1];
      q[2] += sdx * 0.025;
      q[3] += sdy * 0.025;
      q[2] *= 0.93;
      q[3] *= 0.93;
    }

    // damp
    q[2] *= DAMP;
    q[3] *= DAMP;

    // speed cap
    const spd = q[2] * q[2] + q[3] * q[3];
    if (spd > 144) { const s = 12 / Math.sqrt(spd); q[2] *= s; q[3] *= s; }

    // move
    q[0] += q[2];
    q[1] += q[3];

    // respawn if off-screen
    if (q[0] < -30 || q[0] > W + 30 || q[1] < -30 || q[1] > H + 30) {
      const a = Math.random() * 6.2832;
      const d = 80 + Math.random() * 180;
      q[0] = bhx + Math.cos(a) * d;
      q[1] = bhy + Math.sin(a) * d;
      const sp = Math.sqrt(G * BH_MASS / d) * 0.8;
      q[2] = Math.cos(a + 1.5708) * sp;
      q[3] = Math.sin(a + 1.5708) * sp;
      q[6] = -1;
    }
  }
}

// ── render ──
function draw() {
  // fade
  X.globalCompositeOperation = 'destination-out';
  X.fillStyle = 'rgba(0,0,0,0.12)';
  X.fillRect(0, 0, W, H);
  X.globalCompositeOperation = 'source-over';

  // accretion glow
  const r = 100 + Math.sin(frame * 0.02) * 20;
  const g = X.createRadialGradient(bh[0], bh[1], BH_R, bh[0], bh[1], r);
  g.addColorStop(0, 'rgba(160,160,180,0.1)');
  g.addColorStop(0.5, 'rgba(100,100,120,0.03)');
  g.addColorStop(1, 'transparent');
  X.fillStyle = g;
  X.fillRect(bh[0] - r, bh[1] - r, r * 2, r * 2);

  // particles — batch by size for fewer state changes
  X.beginPath();
  for (let i = 0; i < N; i++) {
    const q = p[i];
    X.moveTo(q[0] + q[4], q[1]);
    X.arc(q[0], q[1], q[4], 0, 6.2832);
  }
  X.fillStyle = 'rgba(200,210,255,0.55)';
  X.fill();

  // black hole
  X.beginPath();
  X.arc(bh[0], bh[1], BH_R + 1, 0, 6.2832);
  X.fillStyle = '#000';
  X.fill();

  // event horizon
  X.beginPath();
  X.arc(bh[0], bh[1], BH_R + 2, 0, 6.2832);
  X.strokeStyle = `rgba(180,190,220,${0.25 + Math.sin(frame * 0.04) * 0.08})`;
  X.lineWidth = 1;
  X.stroke();
}

// ── loop ──
function loop() {
  step();
  draw();
  frame++;
  requestAnimationFrame(loop);
}

// ── input ──
let drag = false;
const moveBH = (x, y) => { bh[0] = x; bh[1] = y; };

C.addEventListener('mousedown', e => { drag = true; moveBH(e.clientX, e.clientY); });
C.addEventListener('mousemove', e => { if (drag) moveBH(e.clientX, e.clientY); });
C.addEventListener('mouseup', () => drag = false);
C.addEventListener('touchstart', e => { drag = true; moveBH(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive:false});
C.addEventListener('touchmove', e => { if (drag) moveBH(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive:false});
C.addEventListener('touchend', () => drag = false);

window.addEventListener('resize', () => {
  const oldN = N;
  resize();
  // adjust particle count on breakpoint change
  while (p.length < N) p.push(makeP());
  if (p.length > N) p.length = N;
});

// buttons
document.querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.btn').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  const s = b.dataset.s;
  if (s === 'reset') {
    shape = 'orbit'; shapeOn = false; shapeT = 0; tgt = [];
    init(); return;
  }
  shape = s; shapeOn = false; shapeT = 0;
  tgt = textPts(s === 'ax' ? 'AX' : 'HARAR');
}));

// go
init();
loop();
</script>
</body>
</html>
